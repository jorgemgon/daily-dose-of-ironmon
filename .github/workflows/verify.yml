name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: No ROM or save artefacts
        run: |
          if git ls-files | grep -Ei '\.(gba|gbc|nds|3ds|cia|sav|srm|saveram|state|bps)$'; then
            echo "ROM/save artefacts must never be committed"; exit 1
          fi
